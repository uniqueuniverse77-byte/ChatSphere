<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>ChatSphere - Anonymous Random Chat with Strangers</title>
  <meta name="description" content="Anonymous random chat with strangers via text, video & live webcam. Match by interests and country.">
  <meta name="keywords" content="anonymous random chat, chat with strangers, anonymous chat, random video chat, omegle alternative, chatsphere">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ChatSphere">
  <meta property="og:url" content="https://chatsphere.itsolutions.epizy.com/">
  <meta property="og:title" content="ChatSphere - Anonymous Random Chat with Strangers">
  <meta property="og:description" content="Chat anonymously with strangers using text, video and live webcam. Match by interests and country.">
  <meta property="og:image" content="https://itsolutions.epizy.com/image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <link rel="canonical" href="https://chatsphere.itsolutions.epizy.com/">

  <meta name="author" content="ChatSphere">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <link rel="icon" href="https://itsolutions.epizy.com/logo.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://itsolutions.epizy.com/logo-180.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://chatsphere.itsolutions.epizy.com/#website",
    "name": "ChatSphere",
    "url": "https://chatsphere.itsolutions.epizy.com/",
    "description": "ChatSphere is an anonymous random chat platform to chat with strangers via text, video, and live webcam. Match by interests and country.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://chatsphere.itsolutions.epizy.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <style>
    /* --- Auth Card Styling --- */
    #authCard {
      background: #222 !important;
      border: 1px solid #333 !important;
      border-radius: 0.5rem;
    }
    .nav-pills .nav-link {
      color: #e0e0e0;
      border-radius: 0.375rem;
      transition: all 0.3s ease;
      background-color: transparent;
    }
    .nav-pills .nav-link:hover {
      background-color: #2a2a2a;
    }
    .nav-pills .nav-link.active {
      background-color: #0d6efd !important;
      color: #fff !important;
    }
    .google-btn {
      border-color: #444;
      background-color: #2a2a2a;
      color: #e0e0e0;
      transition: background-color 0.3s, transform 0.2s, border-color 0.3s;
    }
    .google-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: #0d6efd;
      transform: scale(1.02);
    }

    /* Guest Button styling */
    .guest-btn {
      border-color: #0dcaf0;
      color: #0dcaf0;
      background-color: transparent;
      transition: all 0.3s ease;
    }
    .guest-btn:hover {
      background-color: #0dcaf0;
      color: #000;
      transform: scale(1.02);
    }
    
    /* --- Existing Styles --- */
    .video-controls {
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }
    .video-controls button {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .video-controls button:hover {
      transform: scale(1.1);
      background-color: rgba(0,0,0,0.9) !important;
    }
    .video-controls button.muted {
      color: #dc3545 !important;
    }
    .video-controls button.video-off {
      color: #dc3545 !important;
    }
    .video-stream {
      background-color: #000;
      width: 100%;
      aspect-ratio: 16 / 9;   /* This maintains the PC widescreen shape */
    /*object-fit: cover; */    /* This crops the mobile portrait view to fit the wide box */
      border-radius: 0.375rem;
    }
    .flag-img {
      width: 24px;
      height: 18px;
      object-fit: cover;
      border-radius: 2px;
    }
    .chat-box {
      height: 200px;
      overflow-y: auto;
      background-color: #1a1a1a;
      border-radius: 0.375rem;
      padding: 1rem;
    }
    .message {
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      max-width: 80%;
    }
    .user-message {
      background-color: #0d6efd;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .stranger-message {
      background-color: #495057;
      color: white;
    }
    /* This ensures system messages take up ZERO pixels of space */
   .system-message {
     display: none !important;
     margin: 0 !important;
     padding: 0 !important;
     height: 0 !important;
     visibility: hidden;
    }
    .file-attachment {
      margin-top: 0.5rem;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
    }
    .card {
      background-color: #1e1e1e !important;
      border-color: #333 !important;
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .btn-primary {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
      border-color: #0a58ca;
    }
    .form-control {
      background-color: #2a2a2a;
      border-color: #444;
      color: #e0e0e0;
    }
    .form-control:focus {
      background-color: #2a2a2a;
      border-color: #0d6efd;
      color: #e0e0e0;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .form-check-label {
      color: #e0e0e0;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate__animated { animation-duration: 1s; animation-fill-mode: both; }
    .animate__fadeIn { animation-name: fadeIn; }
    .animate__fadeInUp { animation-name: fadeInUp; }
    .animate__bounceIn { animation-name: bounceIn; }
    .modal { z-index: 9999; }
    .modal-backdrop { z-index: 9998; }
  </style>
</head>
<body class="bg-dark text-light">
  <header class="container-fluid py-3 bg-dark shadow-sm fixed-top">
    <div class="row align-items-center">
      <div class="col-auto">
        <div id="logo" class="fs-4 fw-bold text-primary">ChatSphere</div>
      </div>
      <div class="col-auto ms-auto d-flex align-items-center gap-3">
        <div id="onlineCount" class="badge bg-success rounded-pill">Online: 0</div>
        <button id="logoutBtn" class="btn btn-sm btn-outline-danger" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <main class="container mt-5 pt-5">
    <h1 class="text-center mb-4 animate__animated animate__fadeIn">Anonymous Random Chat with Strangers</h1>

    <div class="row justify-content-center animate__animated animate__fadeInUp" id="authSection" style="display: flex;">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-4" id="authCard">
          <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">Register</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <h4 class="text-center mb-4 text-light">Welcome Back</h4>
              
              <button id="guestLoginBtn" class="btn btn-outline-info w-100 mb-3 d-flex align-items-center justify-content-center gap-2 guest-btn">
                <i class="bi bi-person-bounding-box"></i> Continue as Guest
              </button>

              <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1 border-secondary">
                <span class="mx-2 text-muted small">or use Google / Email</span>
                <hr class="flex-grow-1 border-secondary">
              </div>

              <button id="googleLoginBtn" class="btn btn-outline-light w-100 mb-3 d-flex align-items-center justify-content-center gap-2 google-btn">
                <i class="bi bi-google text-danger"></i> Continue with Google
              </button>
              
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label text-light">Email address</label>
                  <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-light">Password</label>
                  <input type="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
              </form>
            </div>

            <div class="tab-pane fade" id="register" role="tabpanel">
              <h4 class="text-center mb-4 text-light">Create an Account</h4>
              <button id="googleSignUpBtn" class="btn btn-outline-light w-100 mb-3 d-flex align-items-center justify-content-center gap-2 google-btn">
                <i class="bi bi-google text-danger"></i> Sign up with Google
              </button>
              <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1 border-secondary">
                <span class="mx-2 text-muted small">or register with email</span>
                <hr class="flex-grow-1 border-secondary">
              </div>
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label text-light">Email address</label>
                  <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-light">Password</label>
                  <input type="password" class="form-control" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Sign Up</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card bg-dark border-0 shadow-lg mb-5 animate__animated animate__fadeInUp" id="interestCard" style="display: none;">
      <div class="card-body">
        <form id="interestForm">
          <div class="row g-3 justify-content-center">
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interest" value="music" id="music">
                <label class="form-check-label" for="music">Music</label>
              </div>
            </div>
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interest" value="sports" id="sports">
                <label class="form-check-label" for="sports">Sports</label>
              </div>
            </div>
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interest" value="movies" id="movies">
                <label class="form-check-label" for="movies">Movies</label>
              </div>
            </div>
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interest" value="technology" id="technology">
                <label class="form-check-label" for="technology">Technology</label>
              </div>
            </div>
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interest" value="others" id="others">
                <label class="form-check-label" for="others">Others</label>
              </div>
            </div>
          </div>
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-5">Start Chat</button>
          </div>
        </form>
      </div>
    </div>

    <div id="chatArea" style="display:none;">
      <div id="partnerInfo" class="alert alert-info text-center animate__animated animate__bounceIn" style="display:none;">
        <p class="mb-1">You're now chatting with a random stranger</p>
        <div id="countryInfo" class="d-flex justify-content-center align-items-center gap-2">
          <img id="countryFlag" src="" alt="Country Flag" class="flag-img" />
          <span id="countryName" class="fw-semibold"></span>
        </div>
      </div>
      
      <div class="card bg-dark border-0 shadow-lg mb-4">
        <div class="card-body p-0">
          <div id="videoContainer" class="row g-2">
            <div class="col-md-6 position-relative">
              <video id="localVideo" class="w-100 rounded video-stream" autoplay muted playsinline></video>
              <div class="video-controls position-absolute bottom-0 start-0 end-0 p-2 d-flex justify-content-center gap-2">
                <button id="localAudioToggle" class="btn btn-sm btn-dark bg-opacity-75 text-light rounded-circle" title="Toggle Audio">
                  <i class="bi bi-mic-fill"></i>
                </button>
                <button id="localVideoToggle" class="btn btn-sm btn-dark bg-opacity-75 text-light rounded-circle" title="Toggle Video">
                  <i class="bi bi-camera-video-fill"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6 position-relative">
              <video id="remoteVideo" class="w-100 rounded video-stream" autoplay playsinline></video>
              <div class="video-controls position-absolute bottom-0 start-0 end-0 p-2 d-flex justify-content-center gap-2">
                <button id="remoteAudioToggle" class="btn btn-sm btn-dark bg-opacity-75 text-light rounded-circle" title="Toggle Partner's Audio">
                  <i class="bi bi-mic-fill"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card bg-dark border-0 shadow-lg mb-4">
        <div class="card-body chat-box" id="chatBox"></div>
      </div>
      
      <div id="chatControls" class="d-flex gap-2">
        <button id="newMatchBtn" class="btn btn-danger">New Match</button>
        <input id="chatInput" type="text" class="form-control bg-dark text-light border-secondary" placeholder="Type message..." />
        <input type="file" id="fileInput" style="display: none;" />
        <button id="attachmentBtn" class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-paperclip" viewBox="0 0 16 16">
            <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0V3z"/>
          </svg>
        </button>
        <button id="sendBtn" class="btn btn-primary">Send</button>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
